<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Recognition Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="character-display" class="character-card">
            <span id="character"></span>
        </div>
        <div id="animation-container"></div>
        <p id="status">Press the button to start the game.</p>
        <p id="transcript-display"></p>
        <button id="start-btn">Start Listening</button>

        <div id="progress-container">
            <div id="level-indicator">
                LVL <span id="level">1</span>
            </div>
            <div id="progress-bar-wrapper">
                <div id="progress-bar"></div>
                <div id="exp-text">💎 <span id="exp-counter">0 / 81</span></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
